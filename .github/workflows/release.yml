name: Release & Multi-platform Prebuild

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semver tag to publish from (e.g. v0.3.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --manifest-path crates/transformer/Cargo.toml

  build-artifacts:
    name: Build Native - ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: transformer.darwin-arm64.node
            source_lib: crates/transformer/target/aarch64-apple-darwin/release/libcolorye_react_native_css_transformer.dylib
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: transformer.darwin-x64.node
            source_lib: crates/transformer/target/x86_64-apple-darwin/release/libcolorye_react_native_css_transformer.dylib
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: transformer.linux-x64-gnu.node
            source_lib: crates/transformer/target/x86_64-unknown-linux-gnu/release/libcolorye_react_native_css_transformer.so
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: transformer.win32-x64-msvc.node
            source_lib: crates/transformer/target/x86_64-pc-windows-msvc/release/colorye_react_native_css_transformer.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build target
        run: |
          cd crates/transformer
          cargo build --release --target ${{ matrix.target }}

      - name: Copy & Prepare Node binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p native-bin
          cp ${{ matrix.source_lib }} native-bin/${{ matrix.artifact_name }}

      - name: Copy & Prepare Node binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p native-bin
          cp ${{ matrix.source_lib }} native-bin/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: native-bin/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish to npm and GitHub Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          path: crates/transformer/
          merge-multiple: true

      - name: Inspect downloaded binaries
        run: |
          ls -la crates/transformer/*.node || true
          if [ -f crates/transformer/transformer.linux-x64-gnu.node ] && [ ! -f crates/transformer/transformer.node ]; then
            cp crates/transformer/transformer.linux-x64-gnu.node crates/transformer/transformer.node
          fi

      - name: Enable Corepack & Install
        run: |
          corepack enable
          yarn install --immutable || yarn install

      - name: Build Project
        run: yarn build:js

      - name: Publish to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            npm publish --provenance --access public --//registry.npmjs.org/:_authToken="${{ secrets.NPM_TOKEN }}"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping create."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --generate-notes --verify-tag
          fi
