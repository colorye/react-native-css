name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Test (SWC Transformer & CSS Engine)
        run: cargo test --manifest-path crates/transformer/Cargo.toml

  test-js:
    name: JS Build & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install --immutable || yarn install

      - name: Build JavaScript & Sync Types
        run: yarn build:js
