name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Format
        run: cargo fmt --manifest-path crates/transformer/Cargo.toml --check

      - name: Rust Lint (clippy)
        run: cargo clippy --manifest-path crates/transformer/Cargo.toml --all-targets -- -D warnings

      - name: Rust Test (SWC Transformer & CSS Engine)
        run: cargo test --manifest-path crates/transformer/Cargo.toml

  test-js:
    name: Native Build, JS Build & Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install Dependencies
        shell: bash
        run: |
          corepack enable
          yarn install --immutable || yarn install

      - name: Build Native Binding
        run: yarn build:native

      - name: Build JavaScript & Sync Types
        run: yarn build:js

      - name: Smoke Test Native Binding
        run: yarn test:smoke
